name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Upstream 3x-ui version (e.g. v3.4.2)'
        required: true
        default: 'v3.4.2'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # We only build amd64 ourselves (Go source-level fix).
          # Other archs use upstream binary + runtime fix script.
          - goos: linux
            goarch: amd64
            xray_arch: 64

    steps:
      - name: Checkout modified source
        uses: actions/checkout@v4

      - name: Checkout upstream 3x-ui
        uses: actions/checkout@v4
        with:
          repository: MHSanaei/3x-ui
          # When triggered by workflow_dispatch, use the specified upstream version.
          # When triggered by our tag push, default to upstream main branch.
          ref: ${{ github.event.inputs.upstream_version || 'main' }}
          path: upstream-src

      - name: Prepare build directory
        run: |
          # Save our custom files before copying upstream
          mkdir -p /tmp/saeson-mod/internal/web/service /tmp/saeson-mod/internal/web/controller /tmp/saeson-mod/internal/clash_link /tmp/saeson-mod/scripts
          cp internal/web/service/reality_fix.go /tmp/saeson-mod/internal/web/service/ 2>/dev/null || true
          cp internal/web/controller/clash_link_routes.go /tmp/saeson-mod/internal/web/controller/ 2>/dev/null || true
          cp internal/clash_link/*.go /tmp/saeson-mod/internal/clash_link/ 2>/dev/null || true
          cp scripts/inject_reality_fix.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          cp scripts/inject_clash_link.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          # Save our custom x-ui.sh (with Clash Link info in option 4)
          cp x-ui.sh /tmp/saeson-mod/ 2>/dev/null || true
          
          # Copy upstream source to build root
          cp -a upstream-src/. .
          rm -rf upstream-src
          
          # Restore our custom files
          cp /tmp/saeson-mod/internal/web/service/reality_fix.go internal/web/service/
          cp /tmp/saeson-mod/internal/web/controller/clash_link_routes.go internal/web/controller/
          mkdir -p internal/clash_link
          cp /tmp/saeson-mod/internal/clash_link/*.go internal/clash_link/
          mkdir -p scripts
          cp /tmp/saeson-mod/scripts/inject_reality_fix.py scripts/
          cp /tmp/saeson-mod/scripts/inject_clash_link.py scripts/
          # Restore custom x-ui.sh
          cp /tmp/saeson-mod/x-ui.sh . 2>/dev/null || true
          
          # Apply source-level patches (unified diff format)
          if [ -d patches ]; then
            for p in patches/*.patch; do
              if [ -f "$p" ]; then
                echo "Applying patch: $p"
                git apply --whitespace=fix "$p" || echo "WARNING: Patch $p failed to apply (may need update for current upstream)"
              fi
            done
            echo "Source patches applied"
          fi
          
          # Apply frontend patches (Clash subscription in QR modal)
          if [ -d frontend-patches ]; then
            cp -f frontend-patches/pages/inbounds/qr/QrCodeModal.tsx frontend/src/pages/inbounds/qr/QrCodeModal.tsx
            cp -f frontend-patches/pages/clients/ClientQrModal.tsx frontend/src/pages/clients/ClientQrModal.tsx
            echo "Frontend patches applied (Clash subscription in QR modal)"
          fi
          
          echo "Build directory prepared with clash_link module"

      - name: Copy Reality fix source file
        run: |
          # Our reality_fix.go is in internal/web/service/
          if [ -f internal/web/service/reality_fix.go ]; then
            echo "Reality fix source found, will inject calls..."
          else
            echo "WARNING: reality_fix.go not found in checkout"
          fi

      - name: Inject Reality fix into inbound.go
        run: |
          python3 scripts/inject_reality_fix.py internal/web/service/inbound.go

      - name: Inject Clash Link module
        run: |
          python3 scripts/inject_clash_link.py . .
          echo "Clash Link injection complete"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Build Go binary (x-ui panel)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          echo "=== Go version ==="
          go version
          
          # Detect native vs cross-compilation
          HOST_ARCH=$(go env GOHOSTARCH)
          if [ "$GOARCH" = "$HOST_ARCH" ] && [ "$GOOS" = "linux" ]; then
            echo "Native build: CGO enabled"
            export CGO_ENABLED=1
          else
            echo "Cross-compile: CGO disabled"
            export CGO_ENABLED=0
          fi
          
          echo "GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED"
          
          echo "=== Downloading Go dependencies ==="
          go mod download 2>&1
          
          echo "=== Building x-ui ==="
          go build -v -ldflags="-s -w" -o x-ui . 2>&1
          
          echo "=== Build complete ==="
          ls -lh x-ui

      - name: Download xray-core
        run: |
          XRAY_ARCH="${{ matrix.xray_arch }}"
          # Get latest xray-core version
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | grep '"tag_name"' | head -1 | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          echo "Xray version: ${XRAY_VER}"
          
          # Download and extract xray binary + geo data files
          curl -fSL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-${XRAY_ARCH}.zip" -o xray.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          ls -lh xray geoip.dat geosite.dat
          echo "Xray-core + geo data downloaded successfully"
        continue-on-error: false

      - name: Package release
        run: |
          mkdir -p release/x-ui/bin
          
          # Copy panel binary
          cp x-ui release/x-ui/
          
          # Copy xray-core
          if [ -f xray ]; then
            cp xray "release/x-ui/bin/xray-linux-${{ matrix.goarch }}"
            # Copy geo data files (required for xray routing)
            cp geoip.dat release/x-ui/bin/ 2>/dev/null || echo "WARNING: geoip.dat not found"
            cp geosite.dat release/x-ui/bin/ 2>/dev/null || echo "WARNING: geosite.dat not found"
          else
            echo "WARNING: xray binary not found, skipping"
          fi
          
          # Copy management scripts and service files
          cp scripts/x-ui.sh release/x-ui/x-ui-upstream.sh 2>/dev/null || true
          # Use our custom x-ui.sh (with Clash Link info in option 4)
          cp x-ui.sh release/x-ui/x-ui.sh
          
          # Copy service files if they exist
          for f in x-ui.service.* x-ui.rc; do
            if [ -f "$f" ]; then
              cp "$f" release/x-ui/
            fi
          done
          
          # Ensure executables
          chmod +x release/x-ui/x-ui 2>/dev/null || true
          chmod +x release/x-ui/bin/* 2>/dev/null || true
          chmod +x release/x-ui/x-ui.sh 2>/dev/null || true
          
          cd release
          tar czf "../x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" .
          cd ..
          
          echo "Packaged: x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          ls -lh x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Debug artifacts
        run: |
          echo "=== Artifact contents ==="
          find artifacts -type f -ls
          ls -la artifacts/

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.tar.gz" -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "3x-ui moded by saeson ${{ github.ref_name }}"
          body: |
            ## 3x-ui moded by saeson ${{ github.ref_name }}

            ### 修复内容
            - **External Proxy + REALITY Bug 修复 (Go 源码级)**: 修复了 VLESS+REALITY 入站启用 External Proxy 时，xray config.json 中 publicKey 和 fingerprint 被清空为 null 的问题

            ### 新功能 (Clash Link 订阅)
            - **一键生成 Clash Party 配置链接**: 从 3x-ui 入站节点直接生成 Clash Meta YAML 配置文件
            - **VLESS+REALITY 完整兼容**: 正确输出 public-key、short-id、fingerprint、servername 等 REALITY 参数
            - **多节点聚合**: 将多个 3x-ui 入站合并到一个 Clash 配置文件中
            - **Token URL**: 生成固定链接，可直接粘贴到 Clash Party 作为订阅地址
            - **配置备份导出**: 一键导出所有入站、客户端、Host 等设置到 JSON 文件

            ### 增强 (v1.2.2)
            - **x-ui 命令选项 4 增强**: 现在显示服务器 IP、面板 URL、账号密码、Clash Link API 端点等完整信息，无需再手动翻找
            - **chmod 修复**: 安装脚本增加 x-ui.sh 可执行权限设置

            ### API 端点
            - `POST /panel/api/clash-link/generate` — 生成 Clash 配置链接
            - `GET /d/:token` — 获取 Clash YAML 配置（可直接粘贴到 Clash Party）
            - `GET /panel/api/clash-link/backup` — 导出完整配置备份
            - `GET /panel/api/clash-link/list` — 列出所有已生成的配置链接

            ### 架构
            - **linux-amd64**: 包含所有修复和功能的完整编译版
            - **其他架构 (arm64/armv7/...)** : 请使用一键安装脚本，将自动使用上游二进制 + 运行时修复方案

            ### 一键安装
            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/saeson001/3x-ui-moded-by-saeson/main/install.sh)
            ```
          files: |
            release-files/*.tar.gz
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
