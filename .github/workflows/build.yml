name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Upstream 3x-ui version (e.g. v3.4.2)'
        required: true
        default: 'v3.4.2'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    # saeson mod: compile inside Debian 11 (bullseye, glibc 2.31) so the produced
    # binary runs on Debian 11/12 and Ubuntu 20.04+. The default ubuntu-latest
    # (glibc 2.34+) produces binaries that fail on Debian 11 with
    # "GLIBC_2.32/2.33/2.34 not found".
    container:
      image: debian:bullseye
    strategy:
      fail-fast: false
      matrix:
        include:
          # We only build amd64 ourselves (Go source-level fix).
          # Other archs use upstream binary + runtime fix script.
          - goos: linux
            goarch: amd64
            xray_arch: 64

    steps:
      - name: Install container build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -q git curl wget tar ca-certificates unzip python3 \
            gcc libc6-dev libsqlite3-dev pkg-config
          git config --global --add safe.directory '*' || true
          echo "Container glibc: $(ldd --version | head -1)"

      - name: Checkout modified source
        uses: actions/checkout@v4

      - name: Checkout upstream 3x-ui
        uses: actions/checkout@v4
        with:
          repository: MHSanaei/3x-ui
          # All our patches (frontend + web.go injections) are based on upstream v3.4.2.
          # Upstream main has refactored the frontend (StatusCard/XrayStatusCard removed),
          # so pin to v3.4.2 unless a new upstream version is explicitly specified.
          ref: ${{ github.event.inputs.upstream_version || 'v3.4.2' }}
          path: upstream-src

      - name: Prepare build directory
        run: |
          # Save our custom files before copying upstream
          mkdir -p /tmp/saeson-mod/internal/web/service /tmp/saeson-mod/internal/web/controller /tmp/saeson-mod/internal/clash_link /tmp/saeson-mod/internal/netstats /tmp/saeson-mod/internal/firewall /tmp/saeson-mod/scripts
          cp internal/web/service/reality_fix.go /tmp/saeson-mod/internal/web/service/ 2>/dev/null || true
          cp internal/web/controller/clash_link_routes.go /tmp/saeson-mod/internal/web/controller/ 2>/dev/null || true
          cp internal/web/controller/saeson_routes.go /tmp/saeson-mod/internal/web/controller/ 2>/dev/null || true
          cp internal/clash_link/*.go /tmp/saeson-mod/internal/clash_link/ 2>/dev/null || true
          cp internal/netstats/*.go /tmp/saeson-mod/internal/netstats/ 2>/dev/null || true
          cp internal/firewall/*.go /tmp/saeson-mod/internal/firewall/ 2>/dev/null || true
          cp scripts/inject_reality_fix.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          cp scripts/inject_clash_link.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          cp scripts/inject_saeson_routes.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          cp scripts/inject_xray_versions.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          cp scripts/inject_bulk_adjust.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          cp scripts/inject_client_inbound_apply.py /tmp/saeson-mod/scripts/ 2>/dev/null || true
          # Save our custom x-ui.sh (with Clash Link info in option 4)
          cp x-ui.sh /tmp/saeson-mod/ 2>/dev/null || true

          # Copy upstream source to build root
          cp -a upstream-src/. .
          rm -rf upstream-src

          # Restore our custom files
          cp /tmp/saeson-mod/internal/web/service/reality_fix.go internal/web/service/
          cp /tmp/saeson-mod/internal/web/controller/clash_link_routes.go internal/web/controller/
          cp /tmp/saeson-mod/internal/web/controller/saeson_routes.go internal/web/controller/
          mkdir -p internal/clash_link
          cp /tmp/saeson-mod/internal/clash_link/*.go internal/clash_link/
          mkdir -p internal/netstats internal/firewall
          cp /tmp/saeson-mod/internal/netstats/*.go internal/netstats/
          cp /tmp/saeson-mod/internal/firewall/*.go internal/firewall/
          mkdir -p scripts
          cp /tmp/saeson-mod/scripts/inject_reality_fix.py scripts/
          cp /tmp/saeson-mod/scripts/inject_clash_link.py scripts/
          cp /tmp/saeson-mod/scripts/inject_saeson_routes.py scripts/
          cp /tmp/saeson-mod/scripts/inject_xray_versions.py scripts/
          cp /tmp/saeson-mod/scripts/inject_bulk_adjust.py scripts/
          cp /tmp/saeson-mod/scripts/inject_client_inbound_apply.py scripts/
          # Restore custom x-ui.sh
          cp /tmp/saeson-mod/x-ui.sh . 2>/dev/null || true

          # Apply frontend patches (Clash subscription in QR modal)
          if [ -d frontend-patches ]; then
            cp -f frontend-patches/pages/inbounds/qr/QrCodeModal.tsx frontend/src/pages/inbounds/qr/QrCodeModal.tsx
            cp -f frontend-patches/pages/clients/ClientQrModal.tsx frontend/src/pages/clients/ClientQrModal.tsx
            cp -f frontend-patches/pages/clients/ClientResetModal.tsx frontend/src/pages/clients/ClientResetModal.tsx
            # saeson: traffic breakdown + firewall cards on dashboard
            cp -f frontend-patches/pages/index/IndexPage.tsx frontend/src/pages/index/IndexPage.tsx
            cp -f frontend-patches/pages/index/SaesonTrafficCard.tsx frontend/src/pages/index/SaesonTrafficCard.tsx
            cp -f frontend-patches/pages/index/SaesonFirewallCard.tsx frontend/src/pages/index/SaesonFirewallCard.tsx
            # saeson v1.3.9: historical traffic card (per inbound / per client, 24h/7d/1mo/1yr)
            cp -f frontend-patches/pages/index/SaesonTrafficHistoryCard.tsx frontend/src/pages/index/SaesonTrafficHistoryCard.tsx
            # saeson v1.4.8: batch-set inbound association modal + global traffic-reset schedule modal
            cp -f frontend-patches/pages/clients/BulkSetInboundsModal.tsx frontend/src/pages/clients/BulkSetInboundsModal.tsx
            cp -f frontend-patches/pages/index/SaesonTrafficResetModal.tsx frontend/src/pages/index/SaesonTrafficResetModal.tsx
            # saeson v1.3.4: inbound list column widths + centered headers
            cp -f frontend-patches/pages/inbounds/list/useInboundColumns.tsx frontend/src/pages/inbounds/list/useInboundColumns.tsx
            # saeson v1.3.7: sidebar version badge -> fork repo + mod version;
            # panel update modal warning (official updater would overwrite the fork)
            cp -f frontend-patches/layouts/AppSidebar.tsx frontend/src/layouts/AppSidebar.tsx
            cp -f frontend-patches/pages/index/PanelUpdateModal.tsx frontend/src/pages/index/PanelUpdateModal.tsx
            # saeson v1.3.7: inject mod version (from VERSION file) into patched files
            MOD_VER="$(cat VERSION)"
            sed -i "s/__SAESON_MOD_VERSION__/${MOD_VER}/g" \
              frontend/src/layouts/AppSidebar.tsx \
              frontend/src/pages/index/IndexPage.tsx \
              frontend/src/pages/index/PanelUpdateModal.tsx
            echo "saeson mod version injected: ${MOD_VER}"
            echo "Frontend patches applied (Clash subscription + traffic breakdown + firewall + inbound columns + fork version branding)"
          fi

          echo "Build directory prepared with clash_link + netstats + firewall modules"

      - name: Copy Reality fix source file
        run: |
          # Our reality_fix.go is in internal/web/service/
          if [ -f internal/web/service/reality_fix.go ]; then
            echo "Reality fix source found, will inject calls..."
          else
            echo "WARNING: reality_fix.go not found in checkout"
          fi

      - name: Inject Reality fix into inbound.go
        run: |
          python3 scripts/inject_reality_fix.py internal/web/service/inbound.go

      - name: Inject Clash Link module
        run: |
          python3 scripts/inject_clash_link.py . .
          echo "Clash Link injection complete"

      - name: Inject saeson netstats + firewall modules
        run: |
          python3 scripts/inject_saeson_routes.py . .
          echo "Saeson netstats + firewall injection complete"

      - name: Inject client scheduled-reset UI
        run: |
          python3 scripts/inject_client_reset.py . .
          echo "Client scheduled-reset UI injection complete"

      - name: Inject inbound batch-set UI
        run: |
          python3 scripts/inject_inbound_assoc.py . .
          echo "Inbound batch-set UI injection complete"

      - name: Inject Xray version list patch
        run: |
          python3 scripts/inject_xray_versions.py internal/web/service/server.go
          echo "Xray version list patch injected"

      - name: Inject BulkAdjust unlimited-client fix
        run: |
          python3 scripts/inject_bulk_adjust.py .
          echo "BulkAdjust unlimited-client fix injected"

      - name: Inject client_inbound_apply nil-clients guard
        run: |
          python3 scripts/inject_client_inbound_apply.py .
          echo "client_inbound_apply nil-clients guard injected"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Build Go binary (x-ui panel)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          echo "=== Go version ==="
          go version
          
          # Detect native vs cross-compilation
          HOST_ARCH=$(go env GOHOSTARCH)
          if [ "$GOARCH" = "$HOST_ARCH" ] && [ "$GOOS" = "linux" ]; then
            echo "Native build: CGO enabled"
            export CGO_ENABLED=1
          else
            echo "Cross-compile: CGO disabled"
            export CGO_ENABLED=0
          fi
          
          echo "GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED"
          
          echo "=== Downloading Go dependencies ==="
          go mod download 2>&1
          
          echo "=== Building x-ui ==="
          go build -v -ldflags="-s -w" -o x-ui . 2>&1
          
          echo "=== Build complete ==="
          ls -lh x-ui

          echo "=== Verify binary links against container glibc (Debian 11 / glibc 2.31) ==="
          ldd x-ui | grep -E 'libc|libsqlite|not found' || true

      - name: Download xray-core
        run: |
          XRAY_ARCH="${{ matrix.xray_arch }}"
          # Get latest xray-core version
          XRAY_VER=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | grep '"tag_name"' | head -1 | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
          echo "Xray version: ${XRAY_VER}"
          
          # Download and extract xray binary + geo data files
          curl -fSL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-${XRAY_ARCH}.zip" -o xray.zip
          unzip -o xray.zip xray geoip.dat geosite.dat
          chmod +x xray
          ls -lh xray geoip.dat geosite.dat
          echo "Xray-core + geo data downloaded successfully"
        continue-on-error: false

      - name: Package release
        run: |
          mkdir -p release/x-ui/bin
          
          # Copy panel binary
          cp x-ui release/x-ui/
          
          # Copy xray-core
          if [ -f xray ]; then
            cp xray "release/x-ui/bin/xray-linux-${{ matrix.goarch }}"
            # Copy geo data files (required for xray routing)
            cp geoip.dat release/x-ui/bin/ 2>/dev/null || echo "WARNING: geoip.dat not found"
            cp geosite.dat release/x-ui/bin/ 2>/dev/null || echo "WARNING: geosite.dat not found"
          else
            echo "WARNING: xray binary not found, skipping"
          fi
          
          # Copy management scripts and service files
          cp scripts/x-ui.sh release/x-ui/x-ui-upstream.sh 2>/dev/null || true
          # Use our custom x-ui.sh (with Clash Link info in option 4)
          cp x-ui.sh release/x-ui/x-ui.sh
          # saeson: 把管理脚本里的 mod 版本占位符替换为真实版本，使 x-ui version 显示正确 mod 版本
          sed -i "s/__SAESON_MOD_VERSION__/${MOD_VER}/g" release/x-ui/x-ui.sh
          
          # Copy service files if they exist
          for f in x-ui.service.* x-ui.rc; do
            if [ -f "$f" ]; then
              cp "$f" release/x-ui/
            fi
          done
          
          # Ensure executables
          chmod +x release/x-ui/x-ui 2>/dev/null || true
          chmod +x release/x-ui/bin/* 2>/dev/null || true
          chmod +x release/x-ui/x-ui.sh 2>/dev/null || true
          
          cd release
          tar czf "../x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" .
          cd ..
          
          echo "Packaged: x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          ls -lh x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: x-ui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Debug artifacts
        run: |
          echo "=== Artifact contents ==="
          find artifacts -type f -ls
          ls -la artifacts/

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.tar.gz" -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "3x-ui moded by saeson ${{ github.ref_name }}"
          body: |
            ## 3x-ui moded by saeson ${{ github.ref_name }}

            ### v1.5.0 更新（流量绝对值模式 + 删除节点修复 + 安装文字优化）
            - **批量修改流量 = 设定上限（覆盖模式）**：设 50G → 总量变 50G，不管原来多少。不再累加
            - **删除入站节点不再报 "invalid clients format"**：当入站 settings.clients 为 null/缺失时，自动视为空数组处理（注入 `scripts/inject_client_inbound_apply.py` patch 上游 `client_inbound_apply.go` 两处断言点）
            - **安装脚本文字优化**：版本显示更清晰（区分面板内核版本 vs 定制版版本），功能描述更新为完整列表

            ### v1.4.9 更新（批量调整支持无限客户端）
            - **批量设置时长/流量不再跳过无限客户端**：上游 `BulkAdjust` 原逻辑对 `expiryTime=0`（无限期）或 `totalGB=0`（无限流量）的客户端直接跳过。现在改为：设正值时**从当前时间开始设定**（时长）或**直接设为该绝对值**（流量上限）；流量调整统一为**覆盖模式**（设 50G → 总量 50G）。负值调整对无限客户端仍跳过（无法从零减少）
            - **注入脚本**：`scripts/inject_bulk_adjust.py` 在 CI 阶段 patch 上游 `internal/web/service/client_bulk.go` 的 `BulkAdjust()` 函数

            ### v1.4.8 更新（批量设置关联入站 + 全局流量计数重置）
            - **批量设置关联入站（新功能，replace 语义）**：客户端列表「更多」菜单新增「设置关联入站」。选中多个客户端后，一次性把它们当前的关联入站统一改为所选节点（先解除它们关联的其他入站，再关联到所选入站）。典型场景：原来一批用户关联在日本节点，一键全部改到香港节点。后端 `internal/inboundassoc.Set` 复用上游 `BulkDetach` + `BulkAttach`，复用 `client_inbounds` 表与入站 settings 客户端列表维护逻辑
            - **Xray 代理流量 / 总数据 卡片「重置计数」按钮（新功能）**：两张累计卡片右上角各加「重置计数」按钮，一键清零当前所有流量统计。后端 `internal/trafficreset.ResetNow` 同时清零：入站 up/down 列（面板记账）、各客户端 `client_traffics`（含 Xray 内存计数器，复用 `ClientService.ResetTrafficByEmail`，并自动启用被禁用的客户端）、以及网卡累计（采用基线偏移法，使「总数据」卡片从 0 重新累计，因为内核 NIC 计数器无法真正清零）
            - **全局定时重置（新功能）**：「总数据」卡片右上角「定时」按钮打开弹窗，可设置「每月 X 号 H 点 M 分」自动重置全部流量计数（日历日模式，复用 v1.4.0 客户端定时重置的巡检逻辑，作用域为全局）。独立表 `saeson_traffic_reset` 保存调度与 NIC 基线，后端每分钟巡检，到点或错过当日均补执行
            - **API 端点 (saeson mod)**：
              - `POST /panel/api/client-inbounds/bulk-set` — 批量设置关联入站 `{emails:[], inboundIds:[]}`
              - `GET /panel/api/traffic-reset/status` — 全局重置调度状态
              - `POST /panel/api/traffic-reset/set` — 保存全局重置调度
              - `POST /panel/api/traffic-reset/reset-now` — 立即重置全部流量计数

            ### v1.4.0 更新（客户端流量定时重置）
            - **客户端流量定时重置（新功能）**：客户端页每行新增「流量定时重置」按钮（扫帚图标），可设置「每月 X 号 H 点」自动将该客户端流量清零。复用面板原生重置逻辑（`ClientService.ResetTrafficByEmail`），同时重置 DB 计数与 Xray 内存计数器，并自动启用被禁用的客户端。日期超过当月天数自动取月末。后台每分钟巡检，到点或错过时点当日均会补执行。后端独立表 `saeson_client_reset` + 4 个鉴权 API（`/panel/api/client-reset/{list,set,remove,reset-now}`）；支持「立即重置」手动触发
            - **客户端页原生能力提醒**：到期时间 / 总流量(流量上限) / 关联入站 / 续费周期(每 N 天滚动重置) 均为上游 3.4.2 客户端编辑弹窗「基础信息」页签自带字段，无需额外开发；本次新增的「定时重置」为上游 3.7 才有的「按日历日重置」能力的 3.4.2 移植版

            ### v1.3.9 更新
            - **流量时段统计 (新功能)**: 仪表盘新增「流量时段统计」卡片。可按「节点」或「用户」切换，并查看 **24小时内 / 7天内 / 1月内 / 1年内** 的上传/下载流量（分组柱状图 + 累计数值）。后端每 5 分钟采样各入站与各客户端的累计流量并存储小时差值，查询时按所选时段聚合（24h→每小时、7d→每6小时、1mo→每天、1yr→每月）。Xray 重启导致计数器清零会显示为静默时段而非负尖峰
            - **后端**: 新增 `internal/trafficlog` 模块（独立 `saeson_traffic_log` 表，AutoMigrate 自动建表）+ `/panel/api/traffic/targets` 与 `/panel/api/traffic/history` 两个鉴权 API；`inject_saeson_routes.py` 同步复制该模块

            ### v1.3.8 更新
            - **构建兼容性修复 (关键)**: 改用 Debian 11 (bullseye, glibc 2.31) 容器编译，产出的面板二进制现在兼容 Debian 11 / 12 及 Ubuntu 20.04+（此前 ubuntu-latest 编译的二进制需要 GLIBC_2.32/2.33/2.34，在 Debian 11 上直接启动失败 `version GLIBC_2.xx not found`）

            ### v1.3.7 更新
            - **版本显示区分**: 侧边栏底部版本徽章改为 fork 版本号并链接到 saeson 仓库（悬停显示上游基线版本）；仪表盘 3X-UI 卡片移至最底部且默认折叠；面板更新弹窗顶部增加红色警告（官方更新器会覆盖修改版）并显示 saeson mod 版本

            ### v1.3.6 更新
            - **Xray 版本切换列表扩展**: 面板内可切换的 Xray 版本从 3 个扩展到约 29 个（一年内全部版本，v25.8.29 ~ v26.7.28，含 v26.3.27）

            ### v1.3.5 更新
            - **列宽微调**: 入站列表流量列/速度列从 24 字符宽度收紧到 20 字符宽度（208px → 170px），其余列保持不变

            ### v1.3.4 更新
            - **入站列表列宽优化**: 所有列名居中显示；ID 列收紧到 5 位数字宽度，备注列 5 个汉字宽度（超长自动省略，悬停显示全名），端口列 5 位数字宽度，客户端列固定 8 字符宽度，流量/速度列固定 24 字符宽度
            - **更新防挂死**: install.sh 所有下载命令增加连接超时（15 秒）、低速中止（<1KB/s 持续 60 秒）与自动重试（3 次），杜绝更新时服务已停止但下载无限挂起的问题

            ### v1.3.3 更新
            - **二维码弹窗记忆折叠**: 订阅类面板（订阅信息/订阅 JSON/Clash 订阅）不再记忆展开状态，重新打开时默认折叠，仅直链面板记忆上一次选择

            ### 新功能 (v1.3.0)
            - **流量构成区分**: 系统状态页新增「Xray 代理流量」与「系统流量（非代理）」卡片，与"整体速度"同款样式 —— 一眼看出 VPS 计费流量中多少走了代理、多少是 VPS 自身（SSH/扫描/其他服务）
            - **防火墙一键管理**: 系统状态页新增「防火墙」卡片，一键开启仅放行 SSH / 面板 / 全部节点端口 / 自定义端口，其余入站一律拒绝（出站不受影响）；支持 ufw 与 firewalld 双后端
            - **防锁定保护**: 开启防火墙前强制校验 SSH 端口与面板端口在放行列表，绝不把自己锁在外面
            - **SSH 命令行防火墙菜单**: x-ui.sh 选项 23 全面增强 —— 一键安全开启（自动收集 SSH/面板/节点端口）、同步节点端口、多后端支持

            ### 既有功能
            - **External Proxy + REALITY Bug 修复 (Go 源码级)**: 修复了 VLESS+REALITY 入站启用 External Proxy 时，xray config.json 中 publicKey 和 fingerprint 被清空为 null 的问题
            - **Clash Link 订阅**: 一键生成 Clash Party 配置链接，多节点聚合，Token URL 订阅
            - **REALITY 参数修复**: 正确输出 public-key、short-id、fingerprint、servername 等 REALITY 参数

            ### API 端点 (saeson mod)
            - `GET /panel/api/netstats` — 网卡/Xray/系统流量速率与累计
            - `GET /panel/api/firewall/status` — 防火墙状态与放行端口
            - `POST /panel/api/firewall/enable` — 一键开启防火墙
            - `POST /panel/api/firewall/disable` — 关闭防火墙
            - `POST /panel/api/firewall/sync` — 同步节点端口
            - `POST /panel/api/firewall/ports` — 添加/移除自定义端口
            - `POST /panel/api/clash-link/generate` — 生成 Clash 配置链接
            - `GET /d/:token` — 获取 Clash YAML 配置

